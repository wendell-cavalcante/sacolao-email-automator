<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacolão · Automatizador de Notas</title>
<link rel="icon" href="img/logo.jfif" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- SDK do Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="backdrop-ring" aria-hidden="true"></div>

<main class="app">

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-ring">
        <img src="img/logo.jfif" alt="Sacolão" class="brand-logo">
      </div>
      <div class="brand-text">
        <h1>Sacolão</h1>
        <p>Envio de notas &amp; custos</p>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <button id="auth-button" class="theme-toggle-track" style="width:auto; padding:6px 12px; cursor:pointer; color:var(--text); font-size:0.78rem; font-weight:600;" type="button">
        Conectar Google
      </button>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb">
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/></g></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </span>
        </span>
      </button>
    </div>
  </header>

  <!-- CARD -->
  <section class="card" id="compose-card">

    <!-- STEP 1: LOJA -->
    <div class="field-block">
      <label class="field-label">
        <span class="field-index">1</span>
        Para qual loja vai a nota?
      </label>
      <div class="store-grid" id="store-grid">
        <button type="button" class="store-chip" data-store="lapa" style="--chip-color:#e8871e">
          <span class="chip-leaf"></span>
          <span class="chip-name">Lapa</span>
        </button>
        <button type="button" class="store-chip" data-store="hig" style="--chip-color:#9c2b6e">
          <span class="chip-leaf"></span>
          <span class="chip-name">Hig</span>
        </button>
        <button type="button" class="store-chip" data-store="ce" style="--chip-color:#b9c23f">
          <span class="chip-leaf"></span>
          <span class="chip-name">C.E</span>
        </button>
        <button type="button" class="store-chip" data-store="perdizes" style="--chip-color:#c43b3b">
          <span class="chip-leaf"></span>
          <span class="chip-name">Perdizes</span>
        </button>
      </div>
      <p class="field-hint" id="store-hint">Selecione a loja para preencher o destinatário automaticamente.</p>
    </div>

    <!-- STEP 2: PARA / ASSUNTO -->
    <div class="field-block">
      <label class="field-label" for="to-input">
        <span class="field-index">2</span>
        Destinatário
      </label>
      <input type="text" id="to-input" class="text-input" placeholder="Selecione uma loja acima" readonly>
    </div>

    <div class="field-block">
      <label class="field-label" for="subject-input">
        <span class="field-index">3</span>
        Assunto
      </label>
      <input type="text" id="subject-input" class="text-input" placeholder="Ex: Notas Fiscais 27/08 — Sacolão">
    </div>

    <!-- STEP 3: MENSAGEM -->
    <div class="field-block">
      <label class="field-label" for="body-input">
        <span class="field-index">4</span>
        Mensagem
        <span class="field-label-tag">preenchida automaticamente</span>
      </label>
      <textarea id="body-input" class="text-area" rows="7"></textarea>
    </div>

    <!-- STEP 4: ANEXOS -->
    <div class="field-block">
      <label class="field-label">
        <span class="field-index">5</span>
        Anexos
      </label>

      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" multiple hidden>
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p><strong>Clique</strong> ou arraste os arquivos aqui</p>
        <span class="dropzone-sub">notas, comprovantes, PDFs, imagens...</span>
      </div>

      <ul class="file-list" id="file-list"></ul>
    </div>

    <!-- AÇÃO -->
    <button type="button" class="send-button" id="send-button" disabled>
      <span class="send-ring" aria-hidden="true"></span>
      <span class="send-label">Enviar E-mail Direto</span>
      <svg class="send-icon" viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

  </section>

  <footer class="app-footer">
    <span>Sacolão · Automatizador de e-mail</span>
  </footer>

</main>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
